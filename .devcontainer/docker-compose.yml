services:
  zephyr-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      
    volumes:      
      - ..:/workdir/PWM-fan-controller:cached
      - zephyr-ccache:/home/user/.ccache

    environment:
      - USE_CCACHE=1
      
    command: /bin/sh -c "while sleep 1000; do :; done"

volumes:
  zephyr-ccache:
  zephyr-workspace: